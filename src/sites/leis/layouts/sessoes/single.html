{{ define "main" }}
<div class="content" style="max-width:1000px">
  <p class="eyebrow">Sessão da Câmara · {{ substr .Params.data 8 2 }}/{{ substr .Params.data 5 2 }}/{{ substr .Params.data 0 4 }}</p>
  <h1>{{ .Title }}</h1>
  <p style="font-size:15px;color:#5B5B5B">
    <a href="/sessoes/" style="font-weight:700;color:#1E7B4F">← Todas as sessões</a>
    {{ with .Params.resumo }} · {{ . }}{{ end }}
  </p>
  {{ .Content }}
  <p style="margin-top:32px"><a href="/sessoes/">← Voltar às sessões</a> · <a href="/votacoes/">Ver todas as votações</a></p>
</div>
{{ end }}
