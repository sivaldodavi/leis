<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>{{ .Title }} | Leis de Pinheiro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="As leis de Pinheiro/MA em linguagem simples, as proposições da Câmara e os vereadores que as apresentaram. Dados abertos da Câmara e do TSE.">
<meta property="og:title" content="Leis de Pinheiro — Entende lei.">
<meta property="og:description" content="As leis de Pinheiro/MA em linguagem simples, as proposições da Câmara e os vereadores que as apresentaram.">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:site_name" content="Leis de Pinheiro">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F4F1EA;color:#1A1A1A;font-family:Inter,system-ui,sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1100px;margin:0 auto;padding:0 48px}
header.site{display:flex;align-items:center;justify-content:space-between;padding:20px 48px;border-bottom:2px solid #1A1A1A;flex-wrap:wrap;gap:16px;background:#F4F1EA}
.logo{font-size:22px;font-weight:800;letter-spacing:-0.02em}
.logo span{color:#1E7B4F}
nav.site{display:flex;gap:24px;font-size:15px;font-weight:500}
nav.site a{text-decoration:none}
h1.hero{font-size:64px;line-height:1.05;font-weight:800;letter-spacing:-0.03em;margin:0 0 20px}
.eyebrow{margin:0 0 12px;font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#5B5B5B}
.lead{margin:0 0 32px;font-size:20px;line-height:1.5;color:#3A3A3A;max-width:720px}
.btn{padding:16px 28px;font-size:17px;font-weight:700;background:#1E7B4F;color:#fff;border:0;border-radius:0;cursor:pointer;font-family:inherit}
input.search{flex:1;min-width:280px;padding:16px 20px;font-size:17px;border:2px solid #1A1A1A;border-radius:0;background:#fff;font-family:inherit}
.card{background:#fff;border:2px solid #1A1A1A;padding:28px;display:flex;flex-direction:column;gap:14px}
.badge{align-self:flex-start;color:#fff;font-size:13px;font-weight:700;padding:6px 10px}
.badge.vigente{background:#1E7B4F}
.badge.tramit{background:#8A5F00}
.badge.outro{background:#6B6B6B}
.grid{display:grid;gap:24px}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.section{padding:40px 48px 16px}
.section h2{margin:0 0 8px;font-size:28px;font-weight:800;letter-spacing:-.01em}
.section .sub{margin:0 0 20px;font-size:17px;color:#5B5B5B}
.table{min-width:820px;border-top:2px solid #1A1A1A}
.rowgrid{display:grid;grid-template-columns:200px 1fr 190px 200px 140px;gap:14px;padding:14px 0;border-bottom:1px solid #B8B2A3;font-size:15px}
.rowhead{display:grid;grid-template-columns:200px 1fr 190px 200px 140px;gap:14px;padding:12px 0;border-bottom:2px solid #1A1A1A;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5B5B5B}
.verbcard{background:#fff;border:2px solid #1A1A1A;padding:22px}
.verbcard p.t{margin:0 0 6px;font-size:19px;font-weight:800}
.verbcard p.d{margin:0 0 8px;font-size:16px;line-height:1.5}
.verbcard p.e{margin:0;font-size:15px;color:#5B5B5B}
.meter{display:flex;height:28px;border:2px solid #1A1A1A;max-width:960px}
.meter div{height:100%}
.legend{display:flex;gap:32px;flex-wrap:wrap;margin-top:12px;font-size:15px;font-weight:500}
.content{padding:40px 48px 72px;max-width:900px}
.content h1{font-size:40px;font-weight:800;letter-spacing:-.02em;margin:0 0 16px}
.content h2{font-size:24px;font-weight:800;margin:32px 0 12px}
.content h3{font-size:18px;font-weight:700;margin:20px 0 8px}
.content p{margin:0 0 12px;font-size:17px;line-height:1.6}
.content blockquote{border-left:4px solid #1E7B4F;padding:8px 16px;margin:12px 0;background:#fff}
.content ul{margin:0 0 12px 20px}
.content hr{border:0;border-top:2px solid #1A1A1A;margin:24px 0}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:8px 6px;border-bottom:1px solid #B8B2A3;font-size:15px;vertical-align:top;word-break:break-word}
.table th{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5B5B5B}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
footer.site{padding:24px 48px;border-top:2px solid #1A1A1A;font-size:14px;color:#5B5B5B}
.expl{margin:10px 0 4px;border:1px solid #D6D1C4;background:#FBF9F3}
.expl-sum{cursor:pointer;list-style:none;padding:8px 12px;font-size:14px;font-weight:600;color:#5B5B5B;user-select:none}
.expl-sum::-webkit-details-marker{display:none}
.expl-sum:hover{color:#1E7B4F}
.expl-body{padding:8px 12px 12px;font-size:15px;line-height:1.55;color:#3A3A3A}
.expl-titulo{margin:0 0 4px;font-size:15px}
.expl-exemplo{margin:6px 0 0;font-size:14px;color:#5B5B5B}
.profile-btn{padding:6px 12px;font-size:13px;font-weight:600;border:2px solid #1A1A1A;background:#fff;cursor:pointer;font-family:inherit;border-radius:0}
.profile-btn.active{background:#1E7B4F;color:#fff;border-color:#1E7B4F}
.profile-btn:hover:not(.active){background:#F4F1EA}
.pagehead{padding:52px 48px 22px;max-width:1100px}
.pagehead h1{font-size:44px;line-height:1.05;font-weight:800;letter-spacing:-.03em;margin:0 0 10px}
.pagehead .lead{margin-bottom:0}
.stats-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:22px 0 26px}
.stat{background:#fff;border:2px solid #1A1A1A;padding:16px 18px}
.stat .n{display:block;font-size:32px;line-height:1;font-weight:800;color:#1E7B4F;font-variant-numeric:tabular-nums}
.stat .l{display:block;margin-top:7px;font-size:13px;font-weight:600;color:#5B5B5B}
.stat.dark .n{color:#1A1A1A}
.toolbar{background:#fff;border:2px solid #1A1A1A;padding:16px;margin:0 0 20px}
.toolbar + .toolbar{margin-top:-20px}
.toolbar-title{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5B5B5B;margin:0 0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border:2px solid #1A1A1A;background:#fff;font:600 13px Inter,system-ui,sans-serif;cursor:pointer}
.chip:hover{background:#F4F1EA}
.chip.active{background:#1A1A1A;color:#fff}
.chip .count{font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
.filter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.filter-grid label{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#5B5B5B}
.filter-grid select,.filter-grid input{width:100%;margin-top:5px;padding:9px 10px;border:2px solid #1A1A1A;background:#fff;font:15px Inter,system-ui,sans-serif}
.profile-hero{display:grid;grid-template-columns:180px minmax(0,1fr);gap:34px;align-items:start;padding:44px 0 26px;border-bottom:2px solid #1A1A1A}
.avatar{display:block;width:170px;height:222px;object-fit:cover;object-position:center top;border:2px solid #1A1A1A;background:#DED8CA}
.avatar-fallback{display:flex;align-items:center;justify-content:center;width:170px;height:222px;border:2px solid #1A1A1A;background:#1E7B4F;color:#fff;font-size:56px;font-weight:800;letter-spacing:-.04em}
.profile-kicker{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5B5B5B;margin:0 0 8px}
.profile-name{font-size:48px;line-height:1.02;font-weight:800;letter-spacing:-.03em;margin:0 0 12px}
.profile-tags{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:2px solid #1A1A1A;background:#fff;font-size:13px;font-weight:700}
.pill.green{background:#1E7B4F;border-color:#1E7B4F;color:#fff}
.pill.amber{background:#8A5F00;border-color:#8A5F00;color:#fff}
.meta-line{font-size:16px;color:#3A3A3A;margin:0 0 6px}
.meta-line strong{color:#1A1A1A}
.section-line{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:32px 0 14px}
.section-line h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em}
.section-line p{margin:0;font-size:14px;color:#5B5B5B}
.mandato-list{display:grid;gap:12px}
.mandato{background:#fff;border:2px solid #1A1A1A;padding:16px 18px}
.mandato .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.mandato .leg{font-size:19px;font-weight:800}
.mandato .detail{font-size:14px;color:#3A3A3A;margin-top:6px}
.mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.mini{background:#FBF9F3;border:1px solid #D6D1C4;padding:12px}
.mini .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5B5B5B}
.mini .v{font-size:22px;font-weight:800;margin-top:3px}
.verb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.verbcard{background:#fff;border:2px solid #1A1A1A;padding:22px;display:flex;flex-direction:column;gap:8px}
.verbcard p.t{margin:0;font-size:20px;font-weight:800;text-transform:capitalize}
.verbcard p.d{margin:0;font-size:15px;line-height:1.5;color:#3A3A3A}
.verbcard p.e{margin:0;font-size:14px;color:#5B5B5B}
.verbcard a{margin-top:auto;font-size:14px;font-weight:700;color:#1E7B4F}
.callout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;background:#1E7B4F;color:#fff;padding:28px;border:2px solid #1A1A1A}
.callout h2{font-size:30px;line-height:1.05;letter-spacing:-.02em;margin:0 0 10px}
.callout p{margin:0 0 14px;color:#EAF3ED;font-size:16px;line-height:1.55}
.callout a.btn{background:#fff;color:#1E7B4F;display:inline-block;margin-top:4px}
.callout .mini-verbs{display:grid;gap:8px}
.callout .mini-verb{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.45);padding:10px 12px;font-size:14px}
.callout .mini-verb strong{display:block;font-size:15px}
.bar-list{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(120px,220px) minmax(0,1fr) 48px;gap:12px;align-items:center;font-size:14px}
.bar-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:16px;background:#E4DED1;border:1px solid #B8B2A3;overflow:hidden}
.bar-fill{height:100%;background:#1E7B4F;min-width:2px}
.bar-row .val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.data-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px}
.panel{background:#fff;border:2px solid #1A1A1A;padding:22px}
.panel h3{margin:0 0 14px;font-size:20px;font-weight:800}
.panel .note{font-size:13px;color:#5B5B5B;margin:12px 0 0}
.table.cards td,.table.cards th{padding:12px 8px}
.empty{background:#FBF9F3;border:2px dashed #B8B2A3;padding:24px;color:#5B5B5B;font-size:15px}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.person-card{background:#fff;border:2px solid #1A1A1A;display:flex;flex-direction:column;min-height:100%}
.person-photo{width:100%;height:230px;object-fit:cover;object-position:center top;background:#DED8CA;border-bottom:2px solid #1A1A1A}
.person-photo-fallback{display:flex;align-items:center;justify-content:center;width:100%;height:230px;background:#1E7B4F;color:#fff;font-size:48px;font-weight:800;border-bottom:2px solid #1A1A1A}
.person-body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:7px;flex:1}
.person-body h3{font-size:20px;line-height:1.15;margin:0}
.person-body .small{font-size:13px;color:#5B5B5B}
.person-body .link{margin-top:auto;font-size:14px;font-weight:700}
@media(max-width:820px){
  .pagehead{padding:38px 20px 18px}.pagehead h1{font-size:36px}
  .profile-hero{grid-template-columns:130px minmax(0,1fr);gap:18px}.avatar,.avatar-fallback{width:130px;height:170px}.profile-name{font-size:34px}
  .callout{grid-template-columns:1fr}.bar-row{grid-template-columns:minmax(100px,150px) minmax(0,1fr) 42px}
  .person-photo,.person-photo-fallback{height:200px}
}
@media(max-width:720px){h1.hero{font-size:40px}.wrap{padding:0 20px}header.site{padding:20px}.section{padding:40px 20px 16px}.content{padding:40px 20px 72px}.stats-strip{grid-template-columns:1fr 1fr}.profile-hero{grid-template-columns:1fr}.avatar,.avatar-fallback{width:120px;height:158px}.profile-name{font-size:32px}.verbcard{padding:18px}}
</style>
</head>
<body>
{{ partial "header.html" . }}
<main>
{{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
</body>
</html>
