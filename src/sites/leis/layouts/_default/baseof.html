<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>{{ .Title }} | Leis de Pinheiro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="As leis de Pinheiro/MA em linguagem simples: o que está em vigor, o que está em tramitação e para quem interessa. Dados abertos da Câmara Municipal.">
<meta property="og:title" content="Leis de Pinheiro — Entende lei.">
<meta property="og:description" content="As leis de Pinheiro/MA em linguagem simples, com explicações para moradores e dados abertos da Câmara.">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:site_name" content="Leis de Pinheiro">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F4F1EA;color:#1A1A1A;font-family:Inter,system-ui,sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1100px;margin:0 auto;padding:0 48px}
header.site{display:flex;align-items:center;justify-content:space-between;padding:20px 48px;border-bottom:2px solid #1A1A1A;flex-wrap:wrap;gap:16px;background:#F4F1EA}
.logo{font-size:22px;font-weight:800;letter-spacing:-0.02em}
.logo span{color:#1E7B4F}
nav.site{display:flex;gap:24px;font-size:15px;font-weight:500}
nav.site a{text-decoration:none}
h1.hero{font-size:64px;line-height:1.05;font-weight:800;letter-spacing:-0.03em;margin:0 0 20px}
.eyebrow{margin:0 0 12px;font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#5B5B5B}
.lead{margin:0 0 32px;font-size:20px;line-height:1.5;color:#3A3A3A;max-width:720px}
.btn{padding:16px 28px;font-size:17px;font-weight:700;background:#1E7B4F;color:#fff;border:0;border-radius:0;cursor:pointer;font-family:inherit}
input.search{flex:1;min-width:280px;padding:16px 20px;font-size:17px;border:2px solid #1A1A1A;border-radius:0;background:#fff;font-family:inherit}
.card{background:#fff;border:2px solid #1A1A1A;padding:28px;display:flex;flex-direction:column;gap:14px}
.badge{align-self:flex-start;color:#fff;font-size:13px;font-weight:700;padding:6px 10px}
.badge.vigente{background:#1E7B4F}
.badge.tramit{background:#8A5F00}
.badge.outro{background:#6B6B6B}
.grid{display:grid;gap:24px}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.section{padding:40px 48px 16px}
.section h2{margin:0 0 8px;font-size:28px;font-weight:800;letter-spacing:-.01em}
.section .sub{margin:0 0 20px;font-size:17px;color:#5B5B5B}
.table{min-width:820px;border-top:2px solid #1A1A1A}
.rowgrid{display:grid;grid-template-columns:200px 1fr 190px 200px 140px;gap:14px;padding:14px 0;border-bottom:1px solid #B8B2A3;font-size:15px}
.rowhead{display:grid;grid-template-columns:200px 1fr 190px 200px 140px;gap:14px;padding:12px 0;border-bottom:2px solid #1A1A1A;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5B5B5B}
.verbcard{background:#fff;border:2px solid #1A1A1A;padding:22px}
.verbcard p.t{margin:0 0 6px;font-size:19px;font-weight:800}
.verbcard p.d{margin:0 0 8px;font-size:16px;line-height:1.5}
.verbcard p.e{margin:0;font-size:15px;color:#5B5B5B}
.profilecard{display:flex;flex-direction:column;gap:8px;padding:24px;background:#fff;border:2px solid #1A1A1A;text-decoration:none}
.profilecard span.k{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#1E7B4F}
.profilecard strong{font-size:19px}
.profilecard span.d{font-size:15px;color:#3A3A3A}
.meter{display:flex;height:28px;border:2px solid #1A1A1A;max-width:960px}
.meter div{height:100%}
.legend{display:flex;gap:32px;flex-wrap:wrap;margin-top:12px;font-size:15px;font-weight:500}
.content{padding:40px 48px 72px;max-width:900px}
.content h1{font-size:40px;font-weight:800;letter-spacing:-.02em;margin:0 0 16px}
.content h2{font-size:24px;font-weight:800;margin:32px 0 12px}
.content h3{font-size:18px;font-weight:700;margin:20px 0 8px}
.content p{margin:0 0 12px;font-size:17px;line-height:1.6}
.content blockquote{border-left:4px solid #1E7B4F;padding:8px 16px;margin:12px 0;background:#fff}
.content ul{margin:0 0 12px 20px}
.content hr{border:0;border-top:2px solid #1A1A1A;margin:24px 0}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:8px 6px;border-bottom:1px solid #B8B2A3;font-size:15px;vertical-align:top;word-break:break-word}
.table th{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5B5B5B}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
footer.site{padding:24px 48px;border-top:2px solid #1A1A1A;font-size:14px;color:#5B5B5B}
.expl{margin:10px 0 4px;border:1px solid #D6D1C4;background:#FBF9F3}
.expl-sum{cursor:pointer;list-style:none;padding:8px 12px;font-size:14px;font-weight:600;color:#5B5B5B;user-select:none}
.expl-sum::-webkit-details-marker{display:none}
.expl-sum:hover{color:#1E7B4F}
.expl-body{padding:8px 12px 12px;font-size:15px;line-height:1.55;color:#3A3A3A}
.expl-titulo{margin:0 0 4px;font-size:15px}
.expl-exemplo{margin:6px 0 0;font-size:14px;color:#5B5B5B}
.profile-switcher{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.profile-btn{padding:6px 12px;font-size:13px;font-weight:600;border:2px solid #1A1A1A;background:#fff;cursor:pointer;font-family:inherit;border-radius:0}
.profile-btn.active{background:#1E7B4F;color:#fff;border-color:#1E7B4F}
.profile-btn:hover:not(.active){background:#F4F1EA}
@media(max-width:720px){h1.hero{font-size:40px}.wrap{padding:0 20px}header.site{padding:20px}.section{padding:40px 20px 16px}.content{padding:40px 20px 72px}}
</style>
</head>
<body>
{{ partial "header.html" . }}
<main>
{{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
</body>
</html>
